# Listens on 8080 (non-privileged port) so the container can run as a
# non-root user — required by most EKS PodSecurity/PSS baselines.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness probe target for EKS and local health checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime API config, regenerated by docker-entrypoint.d/40-inject-runtime-config.sh
    # on container start — never cache it.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints these filenames, so they're safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths (client-side routes) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
